name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/.ci/ComfyUI
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out tested ComfyUI runtime
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: 5cc4b870094c89090db54bd8d12649dcaf89f2ba
          path: .ci/ComfyUI
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .ci/ComfyUI/requirements.txt
      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r .ci/ComfyUI/requirements.txt -e '.[inference,test]'
          python -m pip check
      - name: Check custom-node loading and workflow schemas
        run: python scripts/validate_comfy_install.py --comfy-root "$PYTHONPATH"
      - name: Check converter entry points
        run: |
          python scripts/convert_comfy_base.py --help
          python scripts/convert_comfy_ptd.py --help
      - name: Check standalone inference entry points
        run: |
          bash -n scripts/sample.sh
          python -m ptd.sample --help
          python scripts/encode_prompts.py --help
          python scripts/encode_image_conditions.py --help
      - name: Run CPU tests, including real ComfyUI integration
        run: |
          python -m pytest tests -q --junitxml="$RUNNER_TEMP/pytest.xml"
          python - "$RUNNER_TEMP/pytest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          report = ET.parse(sys.argv[1])
          assert report.findall('.//testcase'), 'No tests ran'
          assert not report.findall('.//skipped'), 'Required integration tests were skipped'
          PY
      - name: Check Python package build
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/ptd-wheels" .
